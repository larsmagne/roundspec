# /etc/asound.conf
# Play to the sound card and to the ALSA loopback at the same time, so
# roundspec can capture the music from hw:Loopback,1,0.
# Replace "PCH" with your card's name from "aplay -l".

pcm.card_and_loop {
    type multi
    slaves.a.pcm "hw:PCH,0"
    slaves.a.channels 2
    slaves.b.pcm "hw:Loopback,0,0"
    slaves.b.channels 2
    bindings.0 { slave a; channel 0 }
    bindings.1 { slave a; channel 1 }
    bindings.2 { slave b; channel 0 }
    bindings.3 { slave b; channel 1 }
}

pcm.both {
    type route
    slave.pcm "card_and_loop"
    slave.channels 4
    ttable.0.0 1    # left  -> card
    ttable.1.1 1    # right -> card
    ttable.0.2 1    # left  -> loopback
    ttable.1.3 1    # right -> loopback
}

pcm.!default {
    type plug
    slave.pcm "both"
}
